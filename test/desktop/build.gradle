apply plugin: 'application'

sourceSets.main.resources.srcDirs += [ project(':test').file('assets').path ]
mainClassName = 'arc.video.test.desktop.DesktopLauncher'
eclipse.project.name = appName + '-desktop'
sourceCompatibility = 17

dependencies {
	implementation project(':test:core')
	implementation project(':arc-video-desktop:arc-video-sdl')
	implementation "com.github.Anuken.Arc:backend-sdl:$arcVersion"
	implementation "com.github.Anuken.Arc:natives-desktop:$arcVersion"
	implementation fileTree(dir: 'libs', include: ['*.jar'])
}

jar {
	archiveFileName = "${appName}-${archiveVersion.get()}.jar"
	dependsOn configurations.runtimeClasspath
	from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
	manifest {
		attributes 'Main-Class': project.mainClassName
	}
}

run {
	ignoreExitValue = true
}
