apply plugin: 'java-library'

sourceSets {
    main {
        java {
            srcDirs = ["src/"]
        }
    }
}

java {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

dependencies {
    api project(":arc-video-core")
    api "com.github.Anuken.Arc:backend-android:$arcVersion"
}

eclipse.project {
    name = projectGroup + "-android"
}

